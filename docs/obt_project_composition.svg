<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions matching asset catalog style -->
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6ac"/>
    </marker>
    
    <!-- Gradients -->
    <linearGradient id="launchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5a6a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3a4a5a;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="projectGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6a5a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3a5a4a;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a4a7a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4a3a6a;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="#2a2a2a"/>
  
  <!-- Title -->
  <text x="700" y="35" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">OBT Project Composition Flow</text>
  <text x="700" y="55" font-family="Arial, sans-serif" font-size="14" fill="#acd" text-anchor="middle">How multiple projects are discovered and integrated into a unified environment</text>
  
  <!-- Launch Command -->
  <g id="launch-command">
    <rect x="50" y="75" width="1300" height="80" rx="8" fill="url(#launchGrad)" stroke="#6a7a8a" stroke-width="2"/>
    <text x="700" y="100" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">1. Launch Command</text>
    <rect x="100" y="110" width="1200" height="30" rx="4" fill="#3a3a4a" stroke="#5a5a6a" stroke-width="1"/>
    <text x="700" y="129" font-family="Courier, monospace" font-size="11" fill="#8f8" text-anchor="middle">
      obt.env.launch.py --numcores 16 --stagedir ~/.staging --project ~/projects/orkid --project ~/projects/shared --project ~/projects/gameproj
    </text>
  </g>
  
  <!-- Project Discovery Phase -->
  <g id="discovery-phase">
    <text x="700" y="185" font-family="Arial, sans-serif" font-size="16" fill="#8cf" text-anchor="middle" font-weight="bold">2. Project Discovery Phase</text>
    
    <!-- Project 1: orkid -->
    <g id="project-orkid">
      <rect x="80" y="210" width="400" height="220" rx="8" fill="url(#projectGrad)" stroke="#6a8a7a" stroke-width="2"/>
      <text x="280" y="235" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">~/projects/orkid/</text>
      
      <!-- Manifest -->
      <rect x="100" y="250" width="360" height="60" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="280" y="268" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">obt.project/obt.manifest</text>
      <text x="280" y="285" font-family="Courier, monospace" font-size="9" fill="#acd" text-anchor="middle">{"name": "orkid",</text>
      <text x="280" y="298" font-family="Courier, monospace" font-size="9" fill="#acd" text-anchor="middle"> "autoexec": "scripts/init_env.py"}</text>
      
      <!-- Module paths -->
      <rect x="100" y="320" width="170" height="45" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="185" y="338" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Module Paths:</text>
      <text x="185" y="353" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">obt.project/modules/dep/</text>
      
      <!-- Bin paths -->
      <rect x="280" y="320" width="180" height="45" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="370" y="338" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Executable Paths:</text>
      <text x="370" y="353" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">obt.project/bin/</text>
      
      <!-- Init script -->
      <rect x="100" y="375" width="360" height="45" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="280" y="393" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">init_env.py actions:</text>
      <text x="280" y="408" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">• Append to ORKID_ASSET_MANIFEST_DIRS</text>
    </g>
    
    <!-- Project 2: shared -->
    <g id="project-shared">
      <rect x="510" y="210" width="400" height="220" rx="8" fill="url(#projectGrad)" stroke="#6a8a7a" stroke-width="2"/>
      <text x="710" y="235" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">~/projects/shared/</text>
      
      <!-- Manifest -->
      <rect x="530" y="250" width="360" height="60" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="710" y="268" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">obt.project/obt.manifest</text>
      <text x="710" y="285" font-family="Courier, monospace" font-size="9" fill="#acd" text-anchor="middle">{"name": "shared",</text>
      <text x="710" y="298" font-family="Courier, monospace" font-size="9" fill="#acd" text-anchor="middle"> "autoexec": "scripts/init_env.py"}</text>
      
      <!-- Module paths -->
      <rect x="530" y="320" width="170" height="45" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="615" y="338" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Module Paths:</text>
      <text x="615" y="353" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">obt.project/modules/dep/</text>
      
      <!-- Bin paths -->
      <rect x="710" y="320" width="180" height="45" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="800" y="338" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Python Paths:</text>
      <text x="800" y="353" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">shared/python/</text>
      
      <!-- Init script -->
      <rect x="530" y="375" width="360" height="45" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="710" y="393" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">init_env.py actions:</text>
      <text x="710" y="408" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">• Add shared resources to paths</text>
    </g>
    
    <!-- Project 3: gameproj -->
    <g id="project-game">
      <rect x="940" y="210" width="400" height="220" rx="8" fill="url(#projectGrad)" stroke="#6a8a7a" stroke-width="2"/>
      <text x="1140" y="235" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">~/projects/gameproj/</text>
      
      <!-- Manifest -->
      <rect x="960" y="250" width="360" height="60" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="1140" y="268" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">obt.project/obt.manifest</text>
      <text x="1140" y="285" font-family="Courier, monospace" font-size="9" fill="#acd" text-anchor="middle">{"name": "gameproj",</text>
      <text x="1140" y="298" font-family="Courier, monospace" font-size="9" fill="#acd" text-anchor="middle"> "autoexec": "scripts/init_env.py"}</text>
      
      <!-- Module paths -->
      <rect x="960" y="320" width="170" height="45" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="1045" y="338" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Custom Deps:</text>
      <text x="1045" y="353" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">game-specific libs</text>
      
      <!-- Bin paths -->
      <rect x="1140" y="320" width="180" height="45" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="1230" y="338" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Game Tools:</text>
      <text x="1230" y="353" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">obt.project/bin/</text>
      
      <!-- Init script -->
      <rect x="960" y="375" width="360" height="45" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
      <text x="1140" y="393" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">init_env.py actions:</text>
      <text x="1140" y="408" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">• Set game-specific environment vars</text>
    </g>
  </g>
  
  <!-- Integration Phase -->
  <g id="integration-phase">
    <text x="700" y="465" font-family="Arial, sans-serif" font-size="16" fill="#8cf" text-anchor="middle" font-weight="bold">3. Environment Integration Phase</text>
    
    <!-- OBT Processing -->
    <rect x="200" y="490" width="1000" height="140" rx="10" fill="url(#envGrad)" stroke="#7a6a9a" stroke-width="2"/>
    <text x="700" y="515" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">OBT Environment Setup (_obt_config.py)</text>
    
    <!-- Processing steps -->
    <rect x="230" y="535" width="220" height="75" rx="4" fill="#4a3a5a" stroke="#6a5a7a" stroke-width="1"/>
    <text x="340" y="553" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Module Path Merging</text>
    <text x="340" y="570" font-family="Arial, sans-serif" font-size="9" fill="#acd" text-anchor="middle">OBT_MODULES_PATH:</text>
    <text x="340" y="585" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">orkid:shared:gameproj</text>
    <text x="340" y="600" font-family="Arial, sans-serif" font-size="9" fill="#acd" text-anchor="middle">modules</text>
    
    <rect x="470" y="535" width="220" height="75" rx="4" fill="#4a3a5a" stroke="#6a5a7a" stroke-width="1"/>
    <text x="580" y="553" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Executable Path Setup</text>
    <text x="580" y="570" font-family="Arial, sans-serif" font-size="9" fill="#acd" text-anchor="middle">PATH additions:</text>
    <text x="580" y="585" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">All project bins</text>
    <text x="580" y="600" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">Staging bin</text>
    
    <rect x="710" y="535" width="220" height="75" rx="4" fill="#4a3a5a" stroke="#6a5a7a" stroke-width="1"/>
    <text x="820" y="553" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Python Path Setup</text>
    <text x="820" y="570" font-family="Arial, sans-serif" font-size="9" fill="#acd" text-anchor="middle">PYTHONPATH:</text>
    <text x="820" y="585" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">Project pythons</text>
    <text x="820" y="600" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">OBT modules</text>
    
    <rect x="950" y="535" width="220" height="75" rx="4" fill="#4a3a5a" stroke="#6a5a7a" stroke-width="1"/>
    <text x="1060" y="553" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Project List</text>
    <text x="1060" y="570" font-family="Arial, sans-serif" font-size="9" fill="#acd" text-anchor="middle">OBT_PROJECTS_LIST:</text>
    <text x="1060" y="585" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">orkid:shared:gameproj</text>
    <text x="1060" y="600" font-family="Arial, sans-serif" font-size="9" fill="#acd" text-anchor="middle">(colon-separated)</text>
  </g>
  
  <!-- Unified Environment -->
  <g id="unified-env">
    <text x="700" y="665" font-family="Arial, sans-serif" font-size="16" fill="#8cf" text-anchor="middle" font-weight="bold">4. Unified Development Environment</text>
    
    <rect x="80" y="690" width="1260" height="160" rx="10" fill="#4a5a4a" stroke="#6a7a6a" stroke-width="2"/>
    <text x="710" y="715" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Composed Environment Shell</text>
    
    <!-- Available features -->
    <rect x="110" y="735" width="280" height="95" rx="4" fill="#3a3a3a" stroke="#5a5a5a" stroke-width="1"/>
    <text x="250" y="753" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Available Commands</text>
    <text x="250" y="770" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ All OBT commands</text>
    <text x="250" y="785" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Orkid project tools</text>
    <text x="250" y="800" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Shared utilities</text>
    <text x="250" y="815" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Game-specific tools</text>
    
    <rect x="410" y="735" width="280" height="95" rx="4" fill="#3a3a3a" stroke="#5a5a5a" stroke-width="1"/>
    <text x="550" y="753" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Dependency Access</text>
    <text x="550" y="770" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Core OBT deps</text>
    <text x="550" y="785" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Orkid custom deps</text>
    <text x="550" y="800" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Shared library deps</text>
    <text x="550" y="815" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Game-specific deps</text>
    
    <rect x="710" y="735" width="280" height="95" rx="4" fill="#3a3a3a" stroke="#5a5a5a" stroke-width="1"/>
    <text x="850" y="753" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Python Environment</text>
    <text x="850" y="770" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ OBT-built Python</text>
    <text x="850" y="785" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ All project modules</text>
    <text x="850" y="800" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Virtual env integration</text>
    <text x="850" y="815" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ pip packages available</text>
    
    <rect x="1010" y="735" width="300" height="95" rx="4" fill="#3a3a3a" stroke="#5a5a5a" stroke-width="1"/>
    <text x="1160" y="753" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Shell Features</text>
    <text x="1160" y="770" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Custom prompt [obt:projects]</text>
    <text x="1160" y="785" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Tab completion for all tools</text>
    <text x="1160" y="800" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ obt.goto.* navigation</text>
    <text x="1160" y="815" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">✓ Project-specific aliases</text>
  </g>
  
  <!-- Flow arrows -->
  <g id="flow-arrows">
    <path d="M 280 430 L 340 490" stroke="#6ac" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 710 430 L 700 490" stroke="#6ac" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 1140 430 L 1060 490" stroke="#6ac" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 700 630 L 700 665" stroke="#6ac" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>